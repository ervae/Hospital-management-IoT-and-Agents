<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>
text{font-family:Arial,Helvetica,sans-serif}.t{font-size:14px;fill:#222}.ts{font-size:12px;fill:#444}.th{font-size:14px;font-weight:600;fill:#111}
rect{stroke-width:1.2}.arr{stroke:#555;stroke-width:1.6;fill:none}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-green rect{fill:#EAF3DE;stroke:#3B6D11}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
</style><rect width="1000" height="560" fill="#fff"/>
<text class="th" x="500" y="28" text-anchor="middle">Oda düğümü bağlantı şeması (yatak durumu: yük + hareket + kapı)</text>
<text class="ts" x="500" y="48" text-anchor="middle">Etiketli hatlar sinyal bağlantılarıdır; besleme ve GND alttaki güç kutusunda</text>
<g class="c-purple"><rect x="380" y="80" width="200" height="320" rx="10"/>
<text class="ts" x="390" y="110">3V3</text><text class="ts" x="390" y="150">21 SDA</text><text class="ts" x="390" y="168">22 SCL</text>
<text class="ts" x="390" y="240">16 HX DT</text><text class="ts" x="390" y="258">17 HX SCK</text>
<text class="ts" x="390" y="330">34 FSR (isteğe bağlı)</text><text class="ts" x="390" y="384">GND</text>
<text class="ts" x="570" y="110" text-anchor="end">VIN 5V</text><text class="ts" x="570" y="150" text-anchor="end">27 PIR</text>
<text class="ts" x="570" y="220" text-anchor="end">33 KAPI</text><text class="ts" x="570" y="290" text-anchor="end">25 R</text>
<text class="ts" x="570" y="308" text-anchor="end">26 G</text><text class="ts" x="570" y="326" text-anchor="end">4 B</text><text class="ts" x="570" y="384" text-anchor="end">GND</text>
<text class="th" x="480" y="200" text-anchor="middle">ESP32</text><text class="ts" x="480" y="218" text-anchor="middle">DevKit V1</text></g>
<g class="c-blue"><rect x="40" y="90" width="270" height="72" rx="8"/><text class="th" x="52" y="112">BME280 (3.3V modül)</text>
<text class="ts" x="52" y="130">Sıcaklık + nem · I2C 0x76</text><text class="ts" x="52" y="148">+ isteğe bağlı SCD40 (CO2) aynı hatta</text></g>
<path class="arr" d="M310 150 H380"/><text class="ts" x="345" y="143" text-anchor="middle">I2C</text>
<g class="c-coral"><rect x="40" y="190" width="270" height="96" rx="8"/><text class="th" x="52" y="212">4 × 50 kg yük hücresi</text>
<text class="ts" x="52" y="230">Yatak/sedye ayaklarının altında</text><text class="ts" x="52" y="248">Wheatstone köprüsü → HX711</text>
<text class="ts" x="52" y="266">HX711 VCC 3V3 · E+ E- A+ A-</text></g>
<path class="arr" d="M310 236 H380"/><path class="arr" d="M310 254 H380"/>
<g class="c-gray"><rect x="40" y="306" width="270" height="56" rx="8"/><text class="th" x="52" y="328">FSR402 (B planı)</text>
<text class="ts" x="52" y="346">3V3 – FSR – GPIO34 – 10 kΩ – GND</text></g>
<path class="arr" d="M310 326 H380"/>
<g class="c-green"><rect x="680" y="100" width="290" height="70" rx="8"/><text class="th" x="692" y="122">HC-SR501 PIR</text>
<text class="ts" x="692" y="140">Hareket · VCC 5V · çıkış 3.3V</text><text class="ts" x="692" y="158">Tavana yakın, yatağa ve kapıya bakar</text></g>
<path class="arr" d="M680 146 H580"/><text class="ts" x="630" y="140" text-anchor="middle">OUT</text>
<g class="c-teal"><rect x="680" y="190" width="290" height="70" rx="8"/><text class="th" x="692" y="212">MC-38 manyetik kapı sensörü</text>
<text class="ts" x="692" y="230">Bir ucu GPIO33 (INPUT_PULLUP)</text><text class="ts" x="692" y="248">diğer ucu GND · kapı açık = HIGH</text></g>
<path class="arr" d="M680 216 H580"/>
<g class="c-amber"><rect x="680" y="280" width="290" height="70" rx="8"/><text class="th" x="692" y="302">RGB LED (ortak katot)</text>
<text class="ts" x="692" y="320">Her renk 220 Ω ile · kapıdaki durum ışığı</text><text class="ts" x="692" y="338">mavi dolu · sarı bekliyor · mor temizlik · yeşil hazır</text></g>
<path class="arr" d="M580 286 H680"/><path class="arr" d="M580 304 H680"/><path class="arr" d="M580 322 H680"/>
<g class="c-gray"><rect x="40" y="430" width="930" height="100" rx="8"/><text class="th" x="52" y="452">Güç dağıtımı</text>
<text class="ts" x="52" y="472">5V 2A USB adaptör → ESP32 USB girişi (VIN 5V hattı) → PIR VCC</text>
<text class="ts" x="52" y="490">ESP32 3V3 pini → HX711, BME280, (SCD40) VCC · Toplam tüketim ~300 mA; röle, fan ve 12V besleme yok</text>
<text class="ts" x="52" y="508">Tüm GND'ler ortak: ESP32, HX711, BME280, PIR, kapı sensörü, LED ve FSR aynı GND hattına bağlanır</text></g>
</svg>
